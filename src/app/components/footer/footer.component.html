<footer class="footer">
  <div class="footer-container">
    <div class="footer-content">
      <div class="footer-brand">
        <span class="brand-text">Sarah</span>
        <p class="tagline">Creating things in general. But mostly for computers.</p>
      </div>

      <div class="footer-links">
        <h4>Connect</h4>
        <ul class="social-links">
          @for (link of socialLinks; track link.name) {
          <li>
            <a [href]="link.url" target="_blank" rel="noopener noreferrer">
              {{ link.name }}
            </a>
          </li>
          }
        </ul>
      </div>
    </div>

    <div class="footer-bottom">
      <p>&copy; {{ currentYear }} Sarah Abarbanel. All rights reserved.</p>
      <p class="built-with">Built with Angular</p>
    </div>
  </div>
</footer>
